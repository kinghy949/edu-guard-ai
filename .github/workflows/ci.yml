name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: eduguard
          POSTGRES_PASSWORD: eduguard
          POSTGRES_DB: eduguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql+psycopg://eduguard:eduguard@localhost:5432/eduguard_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Pytest with coverage gate
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=60

  frontend:
    name: Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --progress=false

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
