[project]
name = "eduguard-backend"
version = "0.1.0"
description = "EduGuard-AI backend - smart academic early warning system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "passlib>=1.7",
    "bcrypt>=4.0,<4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "email-validator>=2.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
